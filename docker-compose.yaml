name: ${COMPOSE_PROJECT_NAME:-atlas}

services:
  postgres:
    image: postgres:16.3
    container_name: atlas-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas_commerce}
      POSTGRES_USER: ${POSTGRES_USER:-atlas_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../sql/source-ddl:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas_app} -d ${POSTGRES_DB:-atlas_commerce}"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: atlas-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: ${KAFKA_DEFAULT_PARTITIONS:-6}
      KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_DEFAULT_REPLICATION_FACTOR:-1}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-atlas-local-cluster}
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: atlas-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-07-16T23-46-41Z
    container_name: atlas-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atlas_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2024-07-15T17-46-06Z
    container_name: atlas-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atlas_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio}
      S3_BUCKET_BRONZE: ${S3_BUCKET_BRONZE:-atlas-bronze}
      S3_BUCKET_SILVER: ${S3_BUCKET_SILVER:-atlas-silver}
      S3_BUCKET_GOLD: ${S3_BUCKET_GOLD:-atlas-gold}
      S3_BUCKET_QUARANTINE: ${S3_BUCKET_QUARANTINE:-atlas-quarantine}
      S3_BUCKET_CHECKPOINTS: ${S3_BUCKET_CHECKPOINTS:-atlas-checkpoints}
      S3_BUCKET_BACKUPS: ${S3_BUCKET_BACKUPS:-atlas-backups}
      S3_BUCKET_SYNTHETIC: ${S3_BUCKET_SYNTHETIC:-atlas-synthetic}
    entrypoint: >
      /bin/sh -c "
      mc alias set atlas http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing atlas/$${S3_BUCKET_BRONZE};
      mc mb --ignore-existing atlas/$${S3_BUCKET_SILVER};
      mc mb --ignore-existing atlas/$${S3_BUCKET_GOLD};
      mc mb --ignore-existing atlas/$${S3_BUCKET_QUARANTINE};
      mc mb --ignore-existing atlas/$${S3_BUCKET_CHECKPOINTS};
      mc mb --ignore-existing atlas/$${S3_BUCKET_BACKUPS};
      mc mb --ignore-existing atlas/$${S3_BUCKET_SYNTHETIC};
      mc anonymous set none atlas/$${S3_BUCKET_BRONZE};
      mc anonymous set none atlas/$${S3_BUCKET_SILVER};
      mc anonymous set none atlas/$${S3_BUCKET_GOLD};
      mc anonymous set none atlas/$${S3_BUCKET_QUARANTINE};
      mc anonymous set none atlas/$${S3_BUCKET_CHECKPOINTS};
      mc anonymous set none atlas/$${S3_BUCKET_BACKUPS};
      mc anonymous set none atlas/$${S3_BUCKET_SYNTHETIC};
      "
    restart: "no"

  kafka-connect:
    build:
      context: .
      dockerfile: ./connectors/kafka-connect/dockerfile
    container_name: atlas-kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      CONNECT_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}

      CONNECT_GROUP_ID: ${KAFKA_CONNECT_GROUP_ID:-atlas-connect}

      CONNECT_CONFIG_STORAGE_TOPIC: atlas_connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: atlas_connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: atlas_connect_status

      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1

      CONNECT_KEY_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter

      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
      CONNECT_REST_PORT: 8083

      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081

      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    ports:
      - "8083:8083"
    volumes:
      - ../../connectors:/opt/atlas/connectors:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: atlas-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: atlas-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: ${SCHEMA_REGISTRY_URL:-http://schema-registry:8081}
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: atlas-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: ${KAFKA_CONNECT_URL:-http://kafka-connect:8083}
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8085:8080"

  spark-master:
    image: bitnami/spark:3.5.1
    container_name: atlas-spark-master
    environment:
      SPARK_MODE: master
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-atlas_minio}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-change_me_minio}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://minio:9000}
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "7077:7077"
      - "8088:8080"
    volumes:
      - ../../streaming:/opt/atlas/streaming
      - ../../data:/opt/atlas/data

  spark-worker:
    image: bitnami/spark:3.5.1
    container_name: atlas-spark-worker
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:7077}
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-atlas_minio}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-change_me_minio}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://minio:9000}
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    volumes:
      - ../../streaming:/opt/atlas/streaming
      - ../../data:/opt/atlas/data

  airflow-postgres:
    image: postgres:16.3
    container_name: atlas-airflow-postgres
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: ${POSTGRES_USER:-atlas_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local}
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas_app} -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow:
    image: apache/airflow:2.9.2
    container_name: atlas-airflow
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR:-LocalExecutor}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES:-False}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:-postgresql+psycopg2://atlas_app:change_me_local@airflow-postgres:5432/airflow}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-change_me_airflow_secret}
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-change_me_airflow}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-atlas_minio}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-change_me_minio}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://minio:9000}
    command: >
      bash -c "airflow db migrate &&
      airflow users create
      --username $${AIRFLOW_ADMIN_USERNAME}
      --password $${AIRFLOW_ADMIN_PASSWORD}
      --firstname Atlas
      --lastname Admin
      --role Admin
      --email $${AIRFLOW_ADMIN_EMAIL} || true &&
      airflow webserver & airflow scheduler"
    ports:
      - "8080:8080"
    volumes:
      - ../../orchestration/dags:/opt/airflow/dags
      - ../../orchestration/plugins:/opt/airflow/plugins
      - ../../orchestration/include:/opt/airflow/include
      - ../../scripts:/opt/atlas/scripts
      - ../../data:/opt/atlas/data

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: atlas-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../../observability/prometheus/config:/etc/prometheus:ro
      - ../../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    container_name: atlas-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me_grafana}
    ports:
      - "3000:3000"
    volumes:
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: atlas-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ../../observability/alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager

  openmetadata:
    image: openmetadata/server:1.5.0
    container_name: atlas-openmetadata
    environment:
      SERVER_PORT: 8585
    ports:
      - "8585:8585"
    volumes:
      - ../../metadata/openmetadata:/opt/openmetadata/local:ro

  duckdb:
    image: python:3.12-slim
    container_name: atlas-duckdb
    working_dir: /opt/atlas
    command: ["sleep", "infinity"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-atlas_minio}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-change_me_minio}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://minio:9000}
    volumes:
      - ../../data:/opt/atlas/data
      - ../../sql:/opt/atlas/sql:ro

volumes:
  postgres-data:
  kafka-data:
  airflow-postgres-data:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  minio-data: